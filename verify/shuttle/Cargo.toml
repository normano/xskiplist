[package]
name    = "xskiplist_shuttle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
xskiplist = { path = "../..", features = ["verify"] }

[target.'cfg(shuttle)'.dependencies]
shuttle = "0.9"
xskiplist = { path = "../..", features = ["shuttle"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }
