[package]
name    = "xskiplist_loom"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
xskiplist = { path = "../..", features = ["verify"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"
xskiplist = { path = "../..", features = ["loom"] }
# crossbeam-epoch runs on loom's primitives under --cfg crossbeam_loom, which also needs its loom feature.
crossbeam-epoch = { version = "0.9", features = ["loom"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
